services:
  tls-config:
    image: ${SILO_POSTGRES_IMAGE:?set SILO_POSTGRES_IMAGE}
    restart: "no"
    user: root
    entrypoint: ["/usr/local/bin/silo-tls-configure"]
    environment:
      POSTGRES_TLS_CA_B64: ${POSTGRES_TLS_CA_B64:?set POSTGRES_TLS_CA_B64}
      POSTGRES_TLS_CERT_B64: ${POSTGRES_TLS_CERT_B64:?set POSTGRES_TLS_CERT_B64}
      POSTGRES_TLS_KEY_B64: ${POSTGRES_TLS_KEY_B64:?set POSTGRES_TLS_KEY_B64}
    volumes: [postgres-tls:/tls]

  pgbackrest-config:
    image: ${SILO_POSTGRES_IMAGE:?set SILO_POSTGRES_IMAGE}
    restart: "no"
    user: root
    entrypoint: ["/usr/local/bin/silo-pgbackrest-configure"]
    environment:
      PGBACKREST_REPO1_ENDPOINT: ${PGBACKREST_REPO1_ENDPOINT:?set PGBACKREST_REPO1_ENDPOINT}
      PGBACKREST_REPO1_BUCKET: ${PGBACKREST_REPO1_BUCKET:?set PGBACKREST_REPO1_BUCKET}
      PGBACKREST_REPO1_REGION: ${PGBACKREST_REPO1_REGION:-auto}
      PGBACKREST_REPO1_KEY: ${PGBACKREST_REPO1_KEY:?set PGBACKREST_REPO1_KEY}
      PGBACKREST_REPO1_KEY_SECRET: ${PGBACKREST_REPO1_KEY_SECRET:?set PGBACKREST_REPO1_KEY_SECRET}
      PGBACKREST_REPO2_ENDPOINT: ${PGBACKREST_REPO2_ENDPOINT:?set PGBACKREST_REPO2_ENDPOINT}
      PGBACKREST_REPO2_BUCKET: ${PGBACKREST_REPO2_BUCKET:?set PGBACKREST_REPO2_BUCKET}
      PGBACKREST_REPO2_REGION: ${PGBACKREST_REPO2_REGION:-auto}
      PGBACKREST_REPO2_KEY: ${PGBACKREST_REPO2_KEY:?set PGBACKREST_REPO2_KEY}
      PGBACKREST_REPO2_KEY_SECRET: ${PGBACKREST_REPO2_KEY_SECRET:?set PGBACKREST_REPO2_KEY_SECRET}
      PGBACKREST_CIPHER_PASS: ${PGBACKREST_CIPHER_PASS:?set PGBACKREST_CIPHER_PASS}
    volumes:
      - pgbackrest-config:/config
      - pgbackrest-spool:/spool

  postgres:
    image: ${SILO_POSTGRES_IMAGE:?set SILO_POSTGRES_IMAGE}
    restart: unless-stopped
    stop_grace_period: 2m
    shm_size: 1gb
    security_opt: [no-new-privileges:true]
    entrypoint: ["/usr/local/bin/silo-standby-entrypoint"]
    environment:
      PGDATA: /var/lib/postgresql/data
      PRIMARY_DATABASE_HOST: ${POSTGRES_EU_HOST:-db-eu.onsilo.dev}
      PRIMARY_DATABASE_PORT: ${POSTGRES_EU_PORT:-25432}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-silo_replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?set POSTGRES_REPLICATION_PASSWORD}
      POSTGRES_REPLICATION_SLOT: silo_us
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tls/ca.crt
    command:
      - -c
      - listen_addresses=*
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - ssl_ca_file=/tls/ca.crt
      - -c
      - ssl_min_protocol_version=TLSv1.3
      - -c
      - password_encryption=scram-sha-256
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - wal_keep_size=4096MB
      - -c
      - hot_standby=on
      - -c
      - hot_standby_feedback=on
      - -c
      - cluster_name=silo_us
      - -c
      - track_commit_timestamp=on
      - -c
      - max_connections=160
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=8MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=16
      - -c
      - idle_in_transaction_session_timeout=120000
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=2s
      - -c
      - archive_mode=always
      - -c
      - archive_command=pgbackrest --config=/etc/pgbackrest/pgbackrest.conf --stanza=silo archive-push %p
      - -c
      - archive_timeout=60s
    depends_on:
      tls-config: {condition: service_completed_successfully}
      pgbackrest-config: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_REPLICATION_USER:-silo_replicator} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    ports: ["${POSTGRES_PUBLIC_PORT:-25432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/tls:ro
      - pgbackrest-config:/etc/pgbackrest:ro
      - pgbackrest-spool:/var/spool/pgbackrest
    networks:
      - db-private
      - dokploy-network

  pgpool-config:
    image: ghcr.io/deployor/silo-postgres:sha-be5c9f89a22b1c7a5de6044f679e88e283d07a75@sha256:5143b51496626e1075c692ef2af546f6b360d61aab532d46b2778591662e7f50
    restart: "no"
    user: root
    entrypoint: ["/usr/local/bin/silo-pgpool-configure"]
    environment:
      SILO_DATABASE_NAME: ${SILO_DATABASE_NAME:-silo}
      SILO_DATABASE_USER: ${SILO_DATABASE_USER:-silo_app}
      SILO_DATABASE_PASSWORD: ${SILO_DATABASE_PASSWORD:?set SILO_DATABASE_PASSWORD}
      PGPOOL_ADMIN_PASSWORD: ${SILO_DATABASE_PASSWORD:?set SILO_DATABASE_PASSWORD}
      POSTGRES_EU_HOST: ${POSTGRES_EU_HOST:-db-eu.onsilo.dev}
      POSTGRES_EU_PORT: ${POSTGRES_EU_PORT:-25432}
      POSTGRES_US_HOST: postgres
      POSTGRES_US_PORT: "5432"
      PGPOOL_NUM_INIT_CHILDREN: ${PGPOOL_NUM_INIT_CHILDREN:-16}
      PGPOOL_MAX_POOL: ${PGPOOL_MAX_POOL:-2}
    volumes: [pgpool-config:/config]

  pgpool:
    image: ghcr.io/deployor/silo-postgres:sha-be5c9f89a22b1c7a5de6044f679e88e283d07a75@sha256:5143b51496626e1075c692ef2af546f6b360d61aab532d46b2778591662e7f50
    restart: unless-stopped
    user: postgres
    read_only: true
    security_opt: [no-new-privileges:true]
    entrypoint: ["pgpool"]
    command: ["-n", "-f", "/config/pgpool.conf", "-F", "/config/pcp.conf", "-a", "/config/pool_hba.conf", "-k", "/config/.pgpoolkey"]
    environment:
      PGPASSWORD: ${SILO_DATABASE_PASSWORD:?set SILO_DATABASE_PASSWORD}
    depends_on:
      pgpool-config: {condition: service_completed_successfully}
      tls-config: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -p 6432 -U ${SILO_DATABASE_USER:-silo_app} -d ${SILO_DATABASE_NAME:-silo} -Atqc 'select not pg_is_in_recovery()' | grep -qx t"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgpool-config:/config:ro
      - postgres-tls:/tls:ro
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      db-private: null
      dokploy-network:
        aliases: [silo-db-us]

volumes:
  postgres-data: null
  postgres-tls: null
  pgpool-config: null
  pgbackrest-config: null
  pgbackrest-spool: null

networks:
  db-private: {internal: true}
  dokploy-network: {external: true}
